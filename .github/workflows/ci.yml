name: Fintech Core CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Golang Backend Tests & Invariant Verification
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend-go

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: backend-go/go.sum

      - name: Install Dependencies
        run: go mod download

      - name: Run Double-Entry Invariant Unit Tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Verify Binary Compilation
        run: go build -v ./...
